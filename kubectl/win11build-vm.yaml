apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win11build
  namespace: default
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: windows
  annotations:
    harvesterhci.io/reservedMemory: 256Mi
    harvesterhci.io/volumeClaimTemplates: |-
      [{
        "metadata": {
          "name": "win11build-iso",
          "annotations": {
            "harvesterhci.io/imageId": "REPLACE_NAMESPACE/REPLACE_IMAGE_NAME"
          }
        },
        "spec": {
          "accessModes": ["ReadWriteMany"],
          "resources": {"requests": {"storage": "20Gi"}},
          "volumeMode": "Block",
          "storageClassName": "REPLACE_IMAGE_STORAGECLASS"
        }
      },
      {
        "metadata": {
          "name": "win11build-rootdisk"
        },
        "spec": {
          "accessModes": ["ReadWriteOnce"],
          "resources": {"requests": {"storage": "32Gi"}},
          "volumeMode": "Block",
          "storageClassName": "lvm-thin"
        }
      }]
# See winbuild-vm.yaml for the meaning of the REPLACE_* values (imageId short
# name + the ISO image's OWN dedicated StorageClass). Windows 11 additionally
# needs EFI + Secure Boot + vTPM, all set below.
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: win11build
    spec:
      domain:
        firmware:
          bootloader:
            efi:
              secureBoot: true
        cpu:
          cores: 4
        features:
          acpi: {enabled: true}
          apic: {enabled: true}
          smm:  {enabled: true}
          hyperv:
            relaxed:    {enabled: true}
            vapic:      {enabled: true}
            spinlocks:  {enabled: true, spinlocks: 8191}
            vpindex:    {enabled: true}
            synic:      {enabled: true}
            synictimer: {enabled: true}
            ipi:        {enabled: true}
            runtime:    {enabled: true}
            reset:      {enabled: true}
        clock:
          utc: {}
          timer:
            hpet:   {present: false}
            hyperv: {present: true}
            pit:    {tickPolicy: delay}
            rtc:    {tickPolicy: catchup}
        devices:
          tpm: {}
          disks:
          - cdrom: {bus: sata}
            name: windows-iso
            bootOrder: 1
          # virtio-scsi rootdisk (fast) — needs the WinPE DriverPaths block in
          # the Windows 11 answer file. Switch to `sata` if you remove it.
          - disk: {bus: scsi}
            name: rootdisk
            bootOrder: 2
          - cdrom: {bus: sata}
            name: virtio-container-disk
          - cdrom: {bus: sata}
            name: sysprep
          interfaces:
          - name: default
            masquerade: {}
            model: e1000
          inputs:
          - bus: usb
            name: tablet
            type: tablet
        resources:
          limits:
            memory: 8Gi
            cpu: 4
      evictionStrategy: LiveMigrateIfPossible
      networks:
      - name: default
        pod: {}
      volumes:
      - name: windows-iso
        persistentVolumeClaim:
          claimName: win11build-iso
      - name: rootdisk
        persistentVolumeClaim:
          claimName: win11build-rootdisk
      - name: virtio-container-disk
        containerDisk:
          image: registry.suse.com/suse/vmdp/vmdp:2.5.5
          imagePullPolicy: IfNotPresent
      - name: sysprep
        sysprep:
          secret:
            name: win11build-unattend
