apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: winbuild
  namespace: default
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: windows
  annotations:
    harvesterhci.io/reservedMemory: 256Mi
    harvesterhci.io/volumeClaimTemplates: |-
      [{
        "metadata": {
          "name": "winbuild-iso",
          "annotations": {
            "harvesterhci.io/imageId": "REPLACE_NAMESPACE/REPLACE_IMAGE_NAME"
          }
        },
        "spec": {
          "accessModes": ["ReadWriteMany"],
          "resources": {"requests": {"storage": "20Gi"}},
          "volumeMode": "Block",
          "storageClassName": "REPLACE_IMAGE_STORAGECLASS"
        }
      },
      {
        "metadata": {
          "name": "winbuild-rootdisk"
        },
        "spec": {
          "accessModes": ["ReadWriteOnce"],
          "resources": {"requests": {"storage": "32Gi"}},
          "volumeMode": "Block",
          "storageClassName": "REPLACE_STORAGECLASS"
        }
      }]
# ----------------------------------------------------------------------------
# winbuild-iso  -- a fresh clone of your uploaded Windows ISO, attached as the
#   boot CD-ROM. Two REPLACE_* values:
#     harvesterhci.io/imageId  = "<namespace>/<image metadata.name>" of the ISO
#                                (the SHORT name like default/image-xxxxx, NOT
#                                 the displayName).
#     storageClassName         = the ISO image's OWN dedicated StorageClass. In
#                                Harvester every image gets one named
#                                `longhorn-<image-name>` (backingimage backend)
#                                or you can read it from the image object:
#                                  kubectl get vmimage <name> -o \
#                                    jsonpath='{.status.storageClassName}'
#                                Using a GENERIC class (e.g. harvester-longhorn
#                                or any normal data-disk class) makes the imageId
#                                clone silently produce an EMPTY volume ->
#                                "No Bootable Device".
#
# winbuild-rootdisk  -- the golden disk. Set storageClassName to a StorageClass
#   you have tested (harvester-longhorn ships on every cluster). 32Gi is
#   deliberate: the smaller the build disk, the smaller the exported image.
#   Cloudbase-Init's ExtendVolumesPlugin grows C: to fill the target disk on
#   first boot, so VMs cloned from the image can be any size >= 32Gi.
#   Keep accessModes: [ReadWriteOnce] — block-mode/LVM-based CSI classes are
#   typically RWO-only (a ReadWriteMany request is rejected with
#   MULTI_NODE_MULTI_WRITER); RWO is always sufficient here.
# ----------------------------------------------------------------------------
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: winbuild
    spec:
      domain:
        cpu:
          cores: 4
        features:
          acpi: {enabled: true}
          apic: {enabled: true}
          smm:  {enabled: true}
          hyperv:
            relaxed:    {enabled: true}
            vapic:      {enabled: true}
            spinlocks:  {enabled: true, spinlocks: 8191}
            vpindex:    {enabled: true}
            synic:      {enabled: true}
            synictimer: {enabled: true}
            ipi:        {enabled: true}
            runtime:    {enabled: true}
            reset:      {enabled: true}
        clock:
          utc: {}
          timer:
            hpet:   {present: false}
            hyperv: {present: true}
            pit:    {tickPolicy: delay}
            rtc:    {tickPolicy: catchup}
        devices:
          disks:
          - cdrom: {bus: sata}
            name: windows-iso
            bootOrder: 1
          # virtio-scsi rootdisk (fast). Requires the WinPE DriverPaths block in
          # Autounattend.xml so Setup can see the disk. Switch to `sata` only if
          # you strip that block (slower, no driver injection needed).
          - disk: {bus: scsi}
            name: rootdisk
            bootOrder: 2
          - cdrom: {bus: sata}
            name: virtio-container-disk
          - cdrom: {bus: sata}
            name: sysprep
          interfaces:
          - name: default
            masquerade: {}
            model: e1000
          inputs:
          - bus: usb
            name: tablet
            type: tablet
        resources:
          limits:
            memory: 8Gi
            cpu: 4
      evictionStrategy: LiveMigrateIfPossible
      networks:
      - name: default
        pod: {}
      volumes:
      - name: windows-iso
        persistentVolumeClaim:
          claimName: winbuild-iso
      - name: rootdisk
        persistentVolumeClaim:
          claimName: winbuild-rootdisk
      - name: virtio-container-disk
        containerDisk:
          image: registry.suse.com/suse/vmdp/vmdp:2.5.5
          imagePullPolicy: IfNotPresent
      - name: sysprep
        sysprep:
          secret:
            name: winbuild-unattend
